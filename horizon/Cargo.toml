[package]
name = "mmga-horizon"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
mmga-classfile = { path = "../crates/mmga-classfile" }
mmga-runtime = { path = "../crates/mmga-runtime" }
mmga-neoforge = { path = "../crates/mmga-neoforge" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# Pin web-target optional edges to the shared Horizon SDK registry graph.
js-sys = "=0.3.106"
libc = "=0.2.190"
wasm-bindgen = "=0.2.129"
indexmap = { version = "=2.14.2", features = ["serde"] }
equivalent = "=1.0.2"
unicode-ident = "=1.0.26"
syn3 = { package = "syn", version = "=3.0.6" }
bumpalo = { version = "=3.20.3", features = ["allocator-api2"] }
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
nix = "=0.31.3"
log = "=0.4.34"
# Keep the shared optional registry edges on the versions/features pinned by
# Horizon's prebuilt game graph so the launcher's lock audit remains exact.
getrandom = { version = "=0.4.3", features = ["sys_rng", "wasm_js"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["channel", "io", "sink", "std", "async-await"] }
hashbrown = { version = "=0.17.1", default-features = false, features = ["default-hasher", "serde"] }

[dev-dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api", features = ["testing"] }
