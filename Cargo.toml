[workspace]
resolver = "2"
exclude = ["horizon"]
members = [
    "crates/mmga-classfile",
    "crates/mmga-runtime",
    "crates/mmga-neoforge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
